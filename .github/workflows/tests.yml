name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run canonical checks
        run: make check

  spec-and-design:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify vendored checkers
        run: cd tools/blessed && sha256sum -c VENDOR-SHA256SUMS.txt
      - name: Spec pack (strict)
        run: make spec-check ARGS=--strict
      - name: Design handoff (strict)
        run: make design-check ARGS=--strict
      - name: Generated tokens drift
        run: make design-build-check
