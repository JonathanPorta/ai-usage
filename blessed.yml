schema: blessed/repo/v1
project: ai-usage
component: collector
repo_type: daemon
stage: active
stack: [python, macos, launchd, swiftui]
standards:
  - spec-pack.core@1
  - spec-pack.profiles@1
  - design-system.handoff@1
  # Pilots, opted in by the owner on 2026-10-10 (not fleet-wide standards):
  - releases.pipeline@1
  - releases.candidate@1
  - signing.ed25519-detached@1
capabilities: [ai-rules-subtree, sha-pinning, ui-design-system, blessed-scripts, release-candidate-producer]
tracked_dependencies:
  ai_rules:
    origin: https://github.com/JonathanPorta/ai-rules
    tag: v0.13.1
  blessed_checkers:
    origin: https://github.com/JonathanPorta/blessed-cicd
    commit: 60dc5ed67089e55ff25468ae7626a3bb4d24eed8
    vendored_at: tools/blessed
  blessed_scripts:
    release: 0.8.0
    signing: 0.4.0
# The candidate-manifest signing key will be the one privileged authority domain.
# Not provisioned yet: it needs the owner's BWS admin token, the bws category
# (deliberately not vendored into this public repository yet) and a GitHub
# Environment created by the owner. See docs/CI-AND-RELEASE.md.
secret_authorities:
  release-signing:
    authority_type: bwsm
    github_scope: environment
    github_environment: release-signing
    github_secret: BWS_ACCESS_TOKEN
    allowed_refs:
      branches:
        - release
    bwsm_project: ai-usage-release-signing
    bwsm_allowed_projects:
      - ai-usage-release-signing
    machine_account: ai-usage-release-signing-ci
    injects:
      - AI_USAGE_RELEASE_SIGNING_KEY
notes: |
  The collector (Python LaunchAgent) is the primary component. The repo also
  ships a native SwiftUI menu-bar app (macos/) over the collector; its
  desktop-app spec pack is declared in docs/SPEC.yml and its accepted design
  handoff in docs/design/app/handoff.yml.
