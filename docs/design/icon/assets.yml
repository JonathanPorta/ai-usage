    path: ../app/source/ai-usage-design-0.1.1/menu-bar-icons.html
    purpose: Accepted menu-bar glyph states and SF Symbol candidates (shared with the app bucket)
  - id: prototype_icon_family
    path: ../app/source/ai-usage-design-0.1.1/app/icons.js
    purpose: Prototype outline icons; mapped to SF Symbols in IMPLEMENTATION.md §12
